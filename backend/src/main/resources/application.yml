server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: flowstock
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowstock}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postdba}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:flowstock-local-development-secret-change-me-please-32}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
