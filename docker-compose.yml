services:
  postgres:
    image: postgres:16-alpine
    container_name: flowstock-postgres
    environment:
      POSTGRES_DB: flowstock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}"
    ports:
      - "5432:5432"
    volumes:
      - flowstock-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowstock"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: flowstock-backend
    profiles: ["app"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/flowstock
      DB_USERNAME: postgres
      DB_PASSWORD: "${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}"
      JWT_SECRET: "${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}"
      INITIAL_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD:?Defina INITIAL_ADMIN_PASSWORD no arquivo .env}"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: flowstock-frontend
    profiles: ["app"]
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  flowstock-postgres-data:
